name: CNEMC Surface Water Backup

on:
  workflow_dispatch:

  schedule:
    - cron: "7,27,47 * * * *"
      timezone: "Asia/Taipei"

permissions:
  contents: read

concurrency:
  group: cnemc-surfacewater-backup
  cancel-in-progress: false

jobs:
  backup-cnemc:
    runs-on: ubuntu-24.04

    env:
      TZ: Asia/Taipei
      TELITI_TIMEZONE: Asia/Taipei
      TELITI_COLLECTOR_ID: github_actions
      TELITI_DATA_ROOT: ${{ github.workspace }}/run-data
      TELITI_BACKUP_REPO: ${{ github.workspace }}/teliti-data-backup

    steps:
      - name: Check out scraper repository
        uses: actions/checkout@v7

      - name: Check out private data backup repository
        uses: actions/checkout@v7
        with:
          repository: aynuddin0587/teliti-data-backup
          ref: main
          path: teliti-data-backup
          ssh-key: ${{ secrets.TELITI_DATA_DEPLOY_KEY }}
          persist-credentials: true
          fetch-depth: 1

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - name: Restore R environment
        uses: r-lib/actions/setup-renv@v2

      - name: Run CNEMC surface-water scraper
        run: |
          Rscript nmemc/script/02_nmemc_surfacewater_archive.R

      - name: Prepare persistent CNEMC backup
        run: |
          Rscript .github/scripts/prepare_cnemc_backup.R

      - name: Show backup repository changes
        working-directory: teliti-data-backup
        run: |
          echo "Candidate backup changes:"
          git status --short

      - name: Commit and push backup
        working-directory: teliti-data-backup
        run: |
          git config user.name "teliti-github-actions"
          git config user.email "teliti-github-actions@users.noreply.github.com"

          git add cnemc_surfacewater/

          if git diff --cached --quiet; then
            echo "CNEMC snapshot and dictionaries are unchanged."
            echo "Nothing to commit."
          else
            echo "Files to be committed:"
            git diff --cached --name-status

            git commit -m "Update CNEMC surface-water backup"
            git push origin main
          fi

      - name: Show final backup status
        working-directory: teliti-data-backup
        run: |
          git status
          git log --oneline -3

      - name: Upload diagnostics if workflow fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cnemc-backup-failure-${{ github.run_id }}
          path: |
            run-data/nmemc/log/
            run-data/nmemc/data/surfacewater/source/surfacewater_current_meta.rds
          if-no-files-found: warn
          retention-days: 7